<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in | Fatty's Dashboard</title>
<link rel="icon" href="/favicon.ico">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #f8ecd4; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif; padding: 20px; }
  .box { width: min(360px, 100%); text-align: center; }
  img { width: 140px; border-radius: 50%; border: 3px solid #ffd21f; margin: 0 auto 16px; display: block; }
  h1 { font-size: 22px; margin: 0 0 18px; }
  input { width: 100%; box-sizing: border-box; padding: 14px; border-radius: 12px; border: 2px solid #2c2734; background: #16131c; color: #fff; font-size: 17px; }
  input:focus { outline: none; border-color: #ffd21f; }
  button { width: 100%; margin-top: 12px; padding: 14px; border: 0; border-radius: 999px; background: #ffd21f; color: #000; font-weight: 800; font-size: 17px; cursor: pointer; }
  .err { background: #3a1210; color: #ffb3a7; border-radius: 10px; padding: 10px; margin-bottom: 12px; font-size: 14px; }
  .err:empty { display: none; }
</style>
</head>
<body>
<form class="box" method="post" action="/admin/login">
  <img src="/img/icon-192.png" alt="">
  <h1>Fatty's dashboard</h1>
  <div class="err" id="err"></div>
  <label for="pw" style="position:absolute;left:-9999px">Password</label>
  <input id="pw" type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <button type="submit">Sign in</button>
</form>
<script>
  var e = new URLSearchParams(location.search).get('e');
  var m = { bad: 'Wrong password. Try again.', wait: 'Too many tries. Wait 15 minutes.', off: 'Login is off until ADMIN_PASSWORD is set on the server.' };
  if (m[e]) document.getElementById('err').textContent = m[e];
</script>
</body>
</html>
